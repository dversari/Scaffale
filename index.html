<html lang="it">

<style>
:root{--bg:#f2f0eb;--text:#1d1f20;--div:color-mix(in srgb,#1d1f20 16%,transparent);--a:#67836c;--a1:#f0f7f0;--a2:#dcebdd;--a3:#c0d9c3;--a4:#a1bea5;--a6:#5d7862;--a7:#4e6652;--a8:#374a3a;--a9:#253127;--n4:#b7b7ba;--n6:#7a7a7d;--n7:#5d5d60;--fh:"Barlow Condensed",system-ui,sans-serif;--fb:"Barlow",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--fb);overscroll-behavior:none}
a{color:var(--a7)}
button{font:inherit;color:inherit;cursor:pointer}
:focus{outline:none}:focus-visible{outline:2px solid var(--a);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--a) 30%,transparent)}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.015em;line-height:1.05;margin:0}
.k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--a7)}
.muted{color:var(--n7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border:1px solid var(--div);border-radius:0;background:transparent;font-family:var(--fh);font-weight:600;font-size:16px;line-height:1.1}
.btn:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.btn:active{background:color-mix(in srgb,var(--text) 12%,transparent)}
.btn.p{background:var(--a);border-color:var(--a);color:var(--bg);min-height:52px;font-size:18px}
.btn.p:hover{background:var(--a6)}.btn.p:active{background:var(--a7)}
.btn.g{border-color:transparent;color:var(--a7);padding:0 8px}
.btn.g:hover{background:color-mix(in srgb,var(--a) 10%,transparent)}
.btn.ic{width:44px;padding:0}
.btn:disabled{opacity:.45;pointer-events:none}
.bp{position:relative}
.bp>i{position:absolute;width:11px;height:11px;color:color-mix(in srgb,var(--text) 55%,transparent);pointer-events:none}
.bp>i::before,.bp>i::after{content:"";position:absolute;background:currentColor}
.bp>i::before{left:5px;top:0;width:1px;height:100%}.bp>i::after{top:5px;left:0;height:1px;width:100%}
.bp>i:nth-of-type(1){top:-6px;left:-6px}.bp>i:nth-of-type(2){top:-6px;right:-6px}.bp>i:nth-of-type(3){bottom:-6px;left:-6px}.bp>i:nth-of-type(4){bottom:-6px;right:-6px}
.in{width:100%;min-height:46px;padding:8px 12px;font:inherit;font-size:16px;color:var(--text);caret-color:var(--a);background:color-mix(in srgb,var(--text) 4%,transparent);border:1px solid var(--div);border-radius:0}
.in:hover{border-color:color-mix(in srgb,var(--text) 45%,transparent)}.in:focus{border-color:var(--a)}
.field label{display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb,var(--text) 70%,transparent)}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 9px;background:var(--a1);color:var(--a8);white-space:nowrap}
.tag.n{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--n7)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--div);background:transparent;font-family:var(--fh);font-weight:600;font-size:15px}
.chip.on{background:var(--a);border-color:var(--a);color:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--div)}
.seg button{min-height:34px;border:0;background:transparent;font-size:13px}
.seg button+button{border-left:1px solid var(--div)}
.seg button.on{background:var(--text);color:var(--bg)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{padding:calc(var(--sat) + 14px) 20px 12px;display:flex;flex-direction:column;gap:12px}
.top.nav{padding:calc(var(--sat) + 6px) 12px 0;flex-direction:row;justify-content:space-between;align-items:center}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 28px}
.bar{padding:14px 20px calc(var(--sab) + 14px);border-top:1px solid var(--div);background:var(--bg);display:grid;gap:10px}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;box-sizing:border-box;padding:12px 0;border-bottom:1px solid var(--div)}
.row:active{background:color-mix(in srgb,var(--text) 5%,transparent)}
.t1{font-family:var(--fh);font-weight:600;font-size:18px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--n7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:40px;height:56px;border:1px solid var(--div);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:600;font-size:20px;color:var(--a7);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--text)}
.shelf{display:flex;align-items:flex-end;gap:3px;min-height:160px;padding:0 6px;border-bottom:2px solid var(--text);overflow-x:auto}
.spine{all:unset;cursor:pointer;box-sizing:border-box;flex:none;border:1px solid var(--div);writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:600;font-size:13px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine{box-shadow:inset 2px 0 0 rgba(255,255,255,.14),inset -2px 0 0 rgba(0,0,0,.14)}
.spine.new{outline:2px solid var(--a);outline-offset:2px}
.mapw svg{display:block;width:100%;height:auto;background:#f2f0eb}
.mapw [data-a]{cursor:pointer}
.loc{all:unset;cursor:pointer;display:grid;grid-template-columns:24px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:14px;border:1px solid var(--a);box-sizing:border-box}
.loc:active{background:color-mix(in srgb,var(--a) 10%,transparent)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--div);border-left:1px solid var(--div)}
.facts>div{padding:10px 12px;border-right:1px solid var(--div);border-bottom:1px solid var(--div);min-width:0}
.facts .v{font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cover{width:112px;height:164px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.check{width:22px;height:22px;border:1px solid var(--n4);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.check.on{background:var(--a);border-color:var(--a)}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#1d1f20;display:none}
#cam.on{display:block}
.dark{background:transparent;color:var(--bg)}
.dark .shade{position:absolute;inset:0;background:linear-gradient(#1d1f20cc,transparent 22%,transparent 60%,#1d1f20cc);pointer-events:none}
.dbtn{all:unset;cursor:pointer;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fh);font-weight:600;font-size:16px}
.frame{position:relative;width:min(290px,78vw);height:150px;border:1px solid rgba(242,240,235,.55)}
.frame>i{color:var(--bg)}
.line{position:absolute;left:14px;right:14px;height:2px;background:var(--a4);box-shadow:0 0 14px 2px var(--a4);animation:sl 1.4s ease-in-out infinite alternate}
@keyframes sl{from{top:8%}to{top:88%}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.flash{width:min(290px,78vw);padding:12px 14px;border:1px solid var(--a4);background:rgba(37,49,39,.88);display:flex;gap:10px;align-items:center;animation:pop .25s ease-out}
.tray{background:var(--bg);color:var(--text)}
#sheet .bd{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#2b2b2d 50%,transparent)}
#sheet .sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--bg);padding:20px 20px calc(var(--sab) + 20px);display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px color-mix(in srgb,#2b2b2d 22%,transparent);animation:pop .2s ease-out}
.opts{display:grid;gap:6px}
.opts .chip{min-height:44px;font-size:16px}
#toast{position:fixed;left:20px;right:20px;bottom:calc(var(--sab) + 96px);z-index:50;padding:12px 14px;background:var(--a9);color:var(--bg);font-size:14px;display:none;align-items:center;gap:10px;box-shadow:0 3px 10px color-mix(in srgb,#2b2b2d 16%,transparent);animation:pop .25s ease-out}
#toast.on{display:flex}
.menu{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--div);font-size:16px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--a1);color:var(--a8);font-size:14px}
</style>
</head>

<script>
const $ = s => document.querySelector(s);

const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${I[n]}</svg>`;

const KEY = 'scaffale.v1';
const SHELVES = ['A', 'B', 'C', 'D', 'E', 'F'];
const MAPS = { Soggiorno: { name: 'Libreria', vb: [222, 190, 1078, 860], tv: [566, 770, 319, 200], cab: [240, 975, 1045, 75], vani: [['7',250,209,648,72,1],['6',250,293,648,72,0],['5A',300,389,127,84,1],['5B',439,389,201,72,0],['5C',766,389,114,72,0],['5D',892,389,49,84,1],['4',300,485,786,72,0],['3A',300,569,116,96,1],['3B',428,569,115,84,0],['3C',555,569,194,96,1],['3D',761,569,216,84,0],['2',300,677,740,72,0],['1A',300,773,146,190,0],['1B',458,773,108,202,1],['1C',904,773,94,190,0],['1E',1022,773,206,85,0],['1D',1022,882,94,81,0],['1F',1128,882,112,93,1]].map(([n, x, y, w, h, o]) => ({ n, x, y, w, h, o: !!o, lv: parseInt(n, 10), sh: n.replace(/^\d+/, '') })) } };
const vanoOf = l => { const m = l && MAPS[l.room]; if (!m) return null; return m.vani.find(v => v.lv === +l.level && v.sh === (l.shelf || '')) || m.vani.find(v => v.lv === +l.level && !v.sh) || null; };
const vname = l => { const v = vanoOf(l); return v ? v.n : `${l.level}${l.shelf || ''}`; };
const LEVELS = [1, 2, 3, 4, 5, 6];
const S = Object.assign({ books: [], rooms: ['Soggiorno', 'Studio', 'Camera'], lastLoc: { room: 'Soggiorno', shelf: 'A', level: 1 }, layout: 'posizione', hintOff: false }, JSON.parse(localStorage.getItem(KEY) || '{}'));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const U = { screen: 'archive', q: '', room: 'Tutti', mode: 'single', queue: [], pending: null, dup: null, cur: null, loc: null, form: null, flash: null, camErr: null, loading: null, sheet: null, draft: null, newRoom: false };

const short = l => MAPS[l.room] ? `${l.room} · ${vname(l)}` : `${l.room} · ${l.shelf}${l.level}`;
const long = l => MAPS[l.room] ? `${l.room} · ${MAPS[l.room].name} · vano ${vname(l)}` : `${l.room} · Scaffale ${l.shelf} · Ripiano ${l.level}`;
const initial = t => (t || '?').replace(/^(il |la |le |lo |l'|gli |i |the )/i, '').charAt(0).toUpperCase();
function norm(raw) {

}
const isIsbn = d => !!d && /^97[89]\d{10}$/.test(d) && [...d].reduce((n, c, i) => n + +c * (i % 2 ? 3 : 1), 0) % 10 === 0;

let gbPause = 0, lastLookupErr = '';
const GKEY = 'scaffale.googleKey', getGKey = () => { try { return localStorage.getItem(GKEY) || ''; } catch (e) { return ''; } };
const gbInfo = v => ({ t: v.title + (v.subtitle ? ': ' + v.subtitle : ''), a: (v.authors || []).join(', '), p: v.publisher || '', y: (v.publishedDate || '').slice(0, 4), pg: v.pageCount || '', cover: ((v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '').replace('http:', 'https:'), dim: v.dimensions || null });
async function gbFetch(q) {

  const gk = getGKey(), r = await fetch('https://www.googleapis.com/books/v1/volumes?' + q + (gk ? '&key=' + encodeURIComponent(gk) : ''));
  if (r.status === 429 || r.status === 403) { gbPause = Date.now() + 5 * 60e3; throw new Error('Google Books: troppe richieste (' + r.status + ')' + (gk ? '' : ' · aggiungi una chiave Google dal menu ⋯')); }

}
async function lookup(isbn) {

    try { const j = await gbFetch(q); const v = (j.items || []).map(x => x.volumeInfo).find(v => v && v.title && (v.industryIdentifiers || []).some(i => (norm(i.identifier) || '') === isbn)) || (q.startsWith('q=isbn') && j.items && j.items[0] && j.items[0].volumeInfo); if (v) return gbInfo(v); }

let reader = null, lastCode = '', lastAt = 0, flashT, toastT;
let stream = null, loopT = null, busy = false;
async function camStart() {

    camStop();

async function onCode(raw) {
  const d = norm(raw);
  const now = Date.now();
  if (raw === lastCode && now - lastAt < 3000) return;
  lastCode = raw; lastAt = now;
  if (!isIsbn(d)) { flash('Codice non riconosciuto', 'Non è un ISBN: ' + raw); return; }

  else if (U.mode === 'single') { camStop(); openIsbn(d); } else batchAdd(d);
}
async function openIsbn(d) {
  const ex = S.books.find(b => b.isbn === d);
  if (ex) { U.pending = { ...ex }; U.dup = ex.id; U.loading = null; return go('result'); }
  U.loading = d; U.pending = null; U.dup = null; U.loc = { ...S.lastLoc }; go('result');
  const info = await lookup(d);
  if (U.loading !== d) return;
  U.loading = null;
  if (info) { U.pending = { isbn: d, ...info }; render(); }
  else { U.form = { t: '', a: '', p: '', y: '', isbn: d }; U.notFound = true; go('manual'); }
}
function batchAdd(d) {
  if (U.queue.some(q => q.isbn === d)) return flash('Già letto in questa serie', d);
  const ex = S.books.find(b => b.isbn === d);
  const item = ex ? { ...ex, dup: true, include: false, status: 'ok' } : { isbn: d, t: 'Cerco…', a: '', dup: false, include: true, status: 'loading' };
  U.queue.push(item);
  flash(ex ? ex.t : 'ISBN ' + d, ex ? 'Già in archivio · ' + short(ex) : 'Aggiunto alla serie');
  if (!ex) lookup(d).then(info => {
    Object.assign(item, info ? { ...info, status: 'ok' } : { t: 'ISBN ' + d, a: 'Dati non trovati: completali dopo', status: 'missing' });
    if (U.screen === 'scanner' || U.screen === 'batch') render();

}
function addBooks(list, loc) {
  const now = new Date().toISOString();
  const added = list.map(b => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), isbn: b.isbn || '', t: b.t, a: b.a || '', p: b.p || '', y: b.y || '', pg: b.pg || '', cover: b.cover || '', ...(b.dim !== undefined ? { dim: b.dim } : {}), room: loc.room, shelf: loc.shelf, level: loc.level, added: now }));

}

/* ——— dorsi: colore dalla copertina, misure da pagine o dimensioni ——— */
const FALL = ['#6b3a2e', '#2f4858', '#7a6a4f', '#3d5a40', '#8c2f39', '#c9b79c', '#1f2a44', '#a26b3b', '#e8e1d3', '#4a4e69', '#b4532a', '#d8c690'];

function cm(v) { const n = parseFloat(v); if (!n) return 0; return /in/i.test(v) ? n * 2.54 : /mm/i.test(v) ? n / 10 : n; }

  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4);

}
function spineLook(b) {

function dominant(src) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
    const t = setTimeout(() => res(null), 8000);
    im.onerror = () => { clearTimeout(t); res(null); };
    im.onload = () => {
      clearTimeout(t);
      try {
        if (im.naturalWidth < 4) return res(null);
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, 32, 32);
        const px = x.getImageData(0, 0, 32, 32).data, bins = {};

      } catch (e) { res(null); }
    };

  });
}
let enriching = false;
async function enrich() {
  if (enriching) return; enriching = true;

    for (;;) {
      if (!navigator.onLine) break;

/* ——— disegno libreria in legno ——— */
function woodSvg(room, o) {
  const m = MAPS[room], [vx, vy, vw, vh] = m.vb;
  const plank = (x, y, w, h) => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#5d5d60"/>`;
  const defs = '';
  const content = v => {
    if (o.books) {
      const list = o.books.filter(b => b.room === room && vanoOf(b) === v).sort((p, q) => (p.pos ?? 1e9) - (q.pos ?? 1e9));
      if (!list.length) return '';
      const k = v.h / 30, dims = list.map(b => { const d = b.dim || {}; return { b, t: cm(d.thickness) || ((+b.pg || 220) * 0.0065 + 0.25), h: cm(d.height) || (19 + hashT(b.t + b.a) % 5) }; });
      const tot = dims.reduce((a, d) => a + d.t * k, 0), sc = Math.min(1, (v.w - 4) / tot);
      let x = v.x + 2;
      return dims.map(d => { const w = Math.max(1.5, d.t * k * sc), h = Math.min(v.h - 2, d.h * k), sl = spineLook(d.b), r = `<rect data-a="open" data-v="${d.b.id}" x="${x.toFixed(1)}" y="${(v.y + v.h - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${sl.bg}" stroke="rgba(0,0,0,.3)" stroke-width=".6"><title>${esc(d.b.t)}</title></rect>`; x += w; return r; }).join('');
    }
    return '';
  };
  const box = v => { const t = 7;
    if (v.o) return `<rect x="${v.x + 2}" y="${v.y + 2}" width="${v.w - 4}" height="${v.h - 4}" fill="none" stroke="#b7b7ba" stroke-width="2" stroke-dasharray="8 6"/>${content(v)}${lab(v)}`;
    return `<rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" fill="#e7e4dd"/>${content(v)}${lab(v)}`
      + plank(v.x - t, v.y - t, v.w + 2 * t, t) + plank(v.x - t, v.y + v.h, v.w + 2 * t, t) + plank(v.x - t, v.y, t, v.h, 1) + plank(v.x + v.w, v.y, t, v.h, 1); };
  const lab = v => o.pick ? '' : `<text x="${v.x + 6}" y="${v.y + 6}" dominant-baseline="hanging" style="font:600 ${Math.min(30, v.h * 0.42).toFixed(0)}px 'Barlow Condensed',sans-serif;fill:#253127;paint-order:stroke;stroke:#f2f0eb;stroke-width:5px;pointer-events:none">${v.n}</text>`;
  const [cx, cy, cw, ch] = m.cab, [tx, ty, tw, th] = m.tv;
  const cab = `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="#e7e4dd" stroke="#5d5d60" stroke-width="6"/>` + [1, 2, 3].map(i => `<line x1="${cx + i * cw / 4}" y1="${cy}" x2="${cx + i * cw / 4}" y2="${cy + ch}" stroke="#5d5d60" stroke-width="3"/>`).join('');
  const pick = o.pick ? m.vani.map(v => { const on = vanoOf(o.pick) === v; return `<g data-a="pickVano" data-v="${v.n}"><rect x="${v.x - (v.o ? 0 : 4)}" y="${v.y - (v.o ? 0 : 4)}" width="${v.w + (v.o ? 0 : 8)}" height="${v.h + (v.o ? 0 : 8)}" fill="${on ? 'rgba(103,131,108,.55)' : 'rgba(255,255,255,.01)'}" stroke="${on ? '#253127' : 'transparent'}" stroke-width="${on ? 6 : 2}"/><text x="${v.x + v.w / 2}" y="${v.y + v.h / 2}" text-anchor="middle" dominant-baseline="central" style="font:600 ${Math.min(34, v.h * 0.5, v.w * 0.55).toFixed(0)}px 'Barlow Condensed',sans-serif;fill:#253127;paint-order:stroke;stroke:#f2f0eb;stroke-width:6px;pointer-events:none">${v.n}</text></g>`; }).join('') : '';
  return `<svg viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="${esc(m.name)} ${esc(room)}">${defs}${m.vani.filter(v => v.o).map(box).join('')}${m.vani.filter(v => !v.o).map(box).join('')}${cab}<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="3" fill="#1d1f20"/>${pick}</svg>`;

async function shrink(file) {

  await new Promise((r, j) => { im.onload = r; im.onerror = () => j(new Error('immagine non leggibile')); im.src = url; });

function download(text, name, type) {

  edit: () => { const b = S.books.find(x => x.id === U.cur); U.form = { t: b.t, a: b.a, p: b.p, y: b.y, isbn: b.isbn, pg: b.pg }; U.loc = { room: b.room, shelf: b.shelf, level: b.level }; go('edit'); },

  if (f === 'gkey') { const k = e.target.gkey.value.trim(); try { k ? localStorage.setItem(GKEY, k) : localStorage.removeItem(GKEY); } catch (err) {} gbPause = 0; U.sheet = null; renderSheet(); toast(k ? 'Chiave Google salvata' : 'Chiave Google rimossa'); enrich(); return; }

});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!Array.isArray(j.books)) throw 0;
    if (j.mode === 'merge') {
      const key = b => b.isbn || (String(b.t) + '|' + String(b.a)).toLowerCase();
      const have = new Set(S.books.map(key));
      const add = j.books.filter(b => b && b.t && !have.has(key(b))).map(b => ({ ...b, id: String(b.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), level: +b.level || 1 }));
      const skip = j.books.length - add.length;
      if (!add.length) { alert('Tutti i libri del file sono già nell\'archivio.'); return; }
      if (!confirm(`Aggiungere ${add.length} libri all'archivio?${skip ? ` ${skip} già presenti verranno saltati.` : ''} I libri attuali restano.`)) return;
      S.books = [...S.books, ...add];
      (Array.isArray(j.rooms) ? j.rooms : []).forEach(r => { if (r && !S.rooms.includes(r)) S.rooms.push(r); });
      save(); U.sheet = null; renderSheet(); render(); enrich(); toast(`${add.length} libri importati`);
      return;
    }
    if (!confirm(`Sostituire l'archivio attuale con ${j.books.length} libri dal backup?`)) return;
    S.books = j.books; if (Array.isArray(j.rooms)) S.rooms = j.rooms; save();
    U.sheet = null; renderSheet(); render(); enrich(); toast(`${j.books.length} libri ripristinati`);
  } catch (err) { alert('File di backup non valido.'); }
});
async function readIsbn(img) {
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': getKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 200, messages: [{ role: 'user', content: [
    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img.split(',')[1] } },
    { type: 'text', text: "Nella foto c'è un libro o una sua pagina con un codice ISBN stampato (retro, risvolto o pagina del copyright). Rispondi solo con l'ISBN, cifre e trattini come stampati, senza altro testo. Se ce ne sono più di uno, scegli quello dell'edizione cartacea in brossura o rilegata. Se non c'è nessun ISBN leggibile, rispondi NESSUNO." }] }] }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? 'chiave API non valida' : (j.error && j.error.message) || 'errore ' + r.status);
  const txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join(' ').toUpperCase();
  for (const c of txt.match(/[0-9][0-9\- ]{8,18}[0-9X]/g) || []) { const d = norm(c); if (isIsbn(d)) return d; }
  return null;
}
async function thumb(file) {
  const url = URL.createObjectURL(file), im = new Image();
  await new Promise((r, j) => { im.onload = r; im.onerror = j; im.src = url; });
  const k = Math.min(1, 260 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.7);
}
async function readCover(img) {
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': getKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({
    model: 'claude-sonnet-5-5', max_tokens: 1024, tool_choice: { type: 'auto' },
    tools: [{ name: 'libro', description: 'Dati del libro letti dalla foto.', input_schema: { type: 'object', required: ['titolo'], properties: { titolo: { type: 'string' }, sottotitolo: { type: 'string' }, autore: { type: 'string', description: 'Nome Cognome; più autori separati da virgola' }, editore: { type: 'string' }, anno: { type: 'string' }, collana: { type: 'string' }, isbn: { type: 'string', description: 'solo se visibile' } } } }],
    messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img.split(',')[1] } },
      { type: 'text', text: "È la foto della copertina (o del frontespizio o del dorso) di un libro. Leggi tutte le informazioni visibili: titolo, sottotitolo, autore, editore, anno, collana, ISBN. Non inventare: lascia vuoto ciò che non si legge. Rispondi solo chiamando lo strumento libro." }] }] }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? 'chiave API non valida' : (j.error && j.error.message) || 'errore ' + r.status);
  const tu = (j.content || []).find(c => c.type === 'tool_use');
  if (tu && tu.input && tu.input.titolo) return tu.input;
  const m = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').match(/\{[\s\S]*\}/);
  if (m) { try { const o = JSON.parse(m[0]); if (o.titolo) return o; } catch (e) {} }
  throw new Error('non riesco a leggere il titolo dalla foto');
}
$('#coverFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const say = (t, n) => U.screen === 'scanner' ? flash(t, n) : toast(t + (n ? ' · ' + n : ''));
  say('Leggo la copertina…', 'Qualche secondo');
  try {
    const [img, th] = await Promise.all([shrink(file), thumb(file)]);
    const c = await readCover(img);
    const isbn = norm(c.isbn || '');
    if (isIsbn(isbn)) { lastCode = ''; await onCode(isbn); return; }
    const t = c.titolo + (c.sottotitolo ? ': ' + c.sottotitolo : '');
    say(c.titolo, 'Cerco l\'edizione…');
    const g = await findByTitle(c.titolo, c.autore || '', c.editore || '');
    const info = { t: g ? g.t : t, a: (g && g.a) || c.autore || '', p: c.editore || (g && g.p) || '', y: c.anno || (g && g.y) || '', pg: (g && g.pg) || '', cover: (g && g.cover) || th, isbn: (g && g.isbn) || '', dim: (g && g.dim) || null, src: 'copertina' };
    if (U.screen === 'scanner' && U.mode === 'link') {
      const x = U.shot && U.shot.items[U.linkIdx];
      const ex = info.isbn && S.books.find(b => b.isbn === info.isbn);
      if (x) { if (ex && !U.shot.items.some(y => y.id === ex.id)) Object.assign(x, { id: ex.id, include: true }); else Object.assign(x, { info, include: true }); }
      flash(info.t, 'Registrato dalla copertina'); setTimeout(nextLink, 1300); return;
    }
    if (U.screen === 'scanner' && U.mode === 'batch') {
      const ex = info.isbn && S.books.find(b => b.isbn === info.isbn);
      U.queue.push(ex ? { ...ex, dup: true, include: false, status: 'ok' } : { ...info, dup: false, include: true, status: 'ok' });
      flash(info.t, ex ? 'Già in archivio · ' + short(ex) : 'Aggiunto alla serie dalla copertina'); return;
    }
    camStop();
    const ex = info.isbn && S.books.find(b => b.isbn === info.isbn);
    if (ex) { U.pending = { ...ex }; U.dup = ex.id; } else { U.pending = info; U.dup = null; }
    if (!U.loc) U.loc = { ...S.lastLoc };
    U.loading = null; go('result');
  } catch (err) { say('Lettura non riuscita', String(err.message || err)); }
});

$('#shotFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  U.shot = { phase: 'working', img: null }; render();
  try {
    const img = await shrink(file); U.shot.img = img; render();
    const libri = await readShelf(img);
    const seen = new Set();
    const items = libri.map(l => {
      const b = l.id && S.books.find(x => x.id === String(l.id));
      if (b) { if (seen.has(b.id)) return null; seen.add(b.id); }
      return { id: b ? b.id : null, t: l.titolo || '', a: l.autore || '', p: l.editore || '', conf: l.certezza || 'media', include: !!b, status: b ? 'ok' : 'todo', info: null };
    }).filter(x => x && (x.id || x.t));
    items.forEach(x => { if (!x.id) x.status = 'looking'; });
    U.shot = { phase: 'review', img, items }; render();
    items.filter(x => !x.id).forEach(async x => {
      const info = await findByTitle(x.t, x.a, x.p);
      if (x.info) return;
      const ex = info && info.isbn && S.books.find(b => b.isbn === info.isbn);
      if (ex && !items.some(y => y.id === ex.id)) Object.assign(x, { id: ex.id, include: true });
      else if (info && !ex) Object.assign(x, { info, include: x.conf !== 'bassa' });
      else if (!info) x.include = x.conf !== 'bassa';
      x.status = 'done';
      if (U.screen === 'shot' && U.shot && U.shot.items === items) render();
    });
  } catch (err) {
    U.shot = { phase: 'ready', err: 'Non sono riuscito a leggere la foto: ' + (err.message || err) + '.' }; render();
  }
});
